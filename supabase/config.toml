# NOTE: Локальное окружение HabitZen не использует имена и порты Telegram-бота.
project_id = "habitzen-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8097"
additional_redirect_urls = ["habitzen://auth/callback", "http://localhost:8097/auth/callback", "http://localhost:8098/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
# WARNING: Только локальная разработка. Для реального окружения подтверждение почты обязательно.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

